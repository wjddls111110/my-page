    <!-- 구글 폰트 적용 (Noto Sans KR & Gmarket Sans 스타일) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Jua&amp;family=Noto+Sans+KR:wght@400;700&amp;display=swap" rel="stylesheet">
    <style>
        /* 기본 스타일 초기화 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(180deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding-bottom: 50px;
        }

        /* 캔버스 Background (기포, 물고기, 파티클 효과) */
        #ocean-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* 메인 컨테이너 */
        .container {
            position: relative;
            z-index: 10;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }

        /* 통통 튀는 별명 헤더 */
        header {
            margin: 30px 0;
        }

        .bouncing-title {
            font-family: 'Jua', sans-serif;
            font-size: 3rem;
            color: #7ef195;
            text-shadow: 0 0 15px rgba(126, 241, 149, 0.6), 0 0 25px rgba(0, 0, 0, 0.5);
            display: inline-block;
        }

        .bouncing-title span {
            display: inline-block;
            animation: bounce 1.2s infinite ease-in-out;
        }

        /* 각 글자마다 애니메이션 딜레이 부여 */
        .bouncing-title span:nth-child(1) { animation-delay: 0.0s; }
        .bouncing-title span:nth-child(2) { animation-delay: 0.1s; }
        .bouncing-title span:nth-child(3) { animation-delay: 0.2s; }
        .bouncing-title span:nth-child(4) { animation-delay: 0.3s; }
        .bouncing-title span:nth-child(5) { animation-delay: 0.4s; }
        .bouncing-title span:nth-child(6) { animation-delay: 0.5s; }
        .bouncing-title span:nth-child(7) { animation-delay: 0.6s; }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-20px) scale(1.15);
                color: #00f2fe;
                text-shadow: 0 0 20px rgba(0, 242, 254, 0.9);
            }
        }

        .subtitle {
            font-size: 1.1rem;
            color: #b2ebf2;
            margin-top: 10px;
            font-weight: 300;
        }

        /* 섹션 공통 카드 스타일 */
        .section-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        .section-title {
            font-family: 'Jua', sans-serif;
            font-size: 1.6rem;
            margin-bottom: 15px;
            color: #4facfe;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        /* 방문자 이름 입력 섹션 */
        .welcome-input-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .welcome-input-group input {
            padding: 12px 20px;
            border-radius: 25px;
            border: 2px solid #4facfe;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 1rem;
            outline: none;
            width: 220px;
            text-align: center;
            font-weight: bold;
        }

        .welcome-input-group button, .custom-btn {
            padding: 12px 24px;
            border-radius: 25px;
            border: none;
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
            transition: all 0.2s ease;
        }

        .welcome-input-group button:hover, .custom-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 114, 255, 0.6);
        }

        .welcome-input-group button:active, .custom-btn:active {
            transform: translateY(1px);
        }

        #welcome-message {
            margin-top: 15px;
            font-size: 1.2rem;
            color: #ffe066;
            font-weight: bold;
            min-height: 1.8em;
        }

        /* 좋아하는 것 3가지 (카드 뒤집기) */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .flip-card {
            background-color: transparent;
            height: 240px;
            perspective: 1000px;
            cursor: pointer;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }

        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
        }

        .flip-card-front {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.05));
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .flip-card-front .icon {
            font-size: 3.5rem;
            margin-bottom: 10px;
        }

        .flip-card-front h3 {
            font-family: 'Jua', sans-serif;
            font-size: 1.5rem;
            color: #ffffff;
        }

        .flip-card-front .hint {
            font-size: 0.8rem;
            color: #b2ebf2;
            margin-top: 8px;
            background: rgba(0, 0, 0, 0.2);
            padding: 3px 10px;
            border-radius: 10px;
        }

        .flip-card-back {
            background: linear-gradient(135deg, #00b4db, #0083b0);
            color: white;
            transform: rotateY(180deg);
            border: 2px solid #7ef195;
        }

        .flip-card-back p {
            font-size: 0.95rem;
            line-height: 1.5;
            word-break: keep-all;
        }

        /* OX 퀴즈 섹션 */
        .quiz-question {
            font-size: 1.3rem;
            margin: 15px 0 20px 0;
            font-weight: bold;
            color: #fff;
        }

        .ox-btn-container {
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        .ox-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: none;
            font-family: 'Jua', sans-serif;
            font-size: 2.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
        }

        .btn-o {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: white;
        }

        .btn-x {
            background: linear-gradient(135deg, #42e695, #3bb2b8);
            color: white;
        }

        .ox-btn:hover {
            transform: scale(1.1);
        }

        .ox-btn:active {
            transform: scale(0.95);
        }

        #quiz-result {
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            min-height: 2em;
        }

        /* 틀렸을 때 화면 흔들림 효과 */
        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        /* 오늘의 운세 섹션 */
        .fortune-display {
            margin-top: 20px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 15px;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px dashed rgba(255, 255, 255, 0.3);
        }

        .fortune-text {
            font-size: 1.15rem;
            color: #ffe066;
            line-height: 1.6;
            word-break: keep-all;
            transition: opacity 0.3s ease;
        }

        .fortune-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        /* 모바일 대응 레이아웃 */
        @media (max-width: 600px) {
            .bouncing-title {
                font-size: 2.2rem;
            }
            .section-box {
                padding: 18px;
            }
            .cards-grid {
                grid-template-columns: 1fr;
            }
            .flip-card {
                height: 200px;
            }
            .welcome-input-group input {
                width: 100%;
            }
        }
    </style>
